
spring.application.name=keystone-backend

# Primary Datasource Credentials
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
# Keep disabled unless migrations are configured and ready
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Railway assigns the application port
server.port=${PORT:8080}

# Respect HTTPS and other forwarded headers from Railway
server.forward-headers-strategy=framework